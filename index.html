<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Từ điển tiếng lóng Gen Z</title>

  <!-- Google Identity (Đăng nhập Gmail, không cần Firebase) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffe6f7, #e0f7ff);
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 1.5em;
      background: #ffb3ec;
      color: #fff;
      font-size: 1.8em;
      font-weight: bold;
      position: relative;
    }
    .container {
      max-width: 900px;
      margin: 2em auto;
      background: white;
      border-radius: 20px;
      padding: 2em;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 1em;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    button {
      background: #00c2ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #0099cc; }
    #dictionaryList div {
      background: #f9f9f9;
      padding: 1em;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    #logoutBtn {
      background: #ff6666;
      position: absolute;
      right: 20px;
      top: 15px;
    }
    h2 { color: #444; }
  </style>
</head>
<body>

  <header>
    🌈 TỪ ĐIỂN TIẾNG LÓNG GEN Z
    <button id="logoutBtn" style="display:none;">Đăng xuất</button>
  </header>

  <div class="container">
    <!-- Đăng nhập Google -->
    <div id="g_id_onload"
      data-client_id="485242988383-un99fql2i2cml594mgc1ipvf97ak8cia.apps.googleusercontent.com"
      data-context="signin"
      data-ux_mode="popup"
      data-callback="handleLogin">
    </div>
    <div class="g_id_signin" data-type="standard"></div>

    <!-- Giao diện Admin -->
    <div id="adminPanel" style="display:none;">
      <h2>📝 Thêm từ tiếng lóng</h2>
      <input id="tu" placeholder="Từ" />
      <input id="loaitu" placeholder="Loại từ (danh từ, động từ...)" />
      <textarea id="nghia" placeholder="Giải nghĩa"></textarea>
      <textarea id="vidu" placeholder="Ví dụ sử dụng"></textarea>
      <textarea id="hoancanh" placeholder="Hoàn cảnh sử dụng"></textarea>
      <textarea id="phucnguyen" placeholder="Phục nguyên nghĩa gốc"></textarea>
      <button onclick="addWord()">Thêm / Cập nhật từ</button>
    </div>

    <!-- Phần tra cứu -->
    <h2>🔍 Tra cứu từ</h2>
    <input id="search" placeholder="Nhập từ cần tra..." oninput="searchWord()" />
    <div id="dictionaryList"></div>
  </div>

  <script>
    const ADMIN_EMAIL = "nguyenbaogialinh2008@gmail.com";  // Chỉ bạn có quyền thêm/sửa
    const DICTIONARY_KEY = "slangDictionary";
    let dictionary = JSON.parse(localStorage.getItem(DICTIONARY_KEY)) || {};

    function renderList(filter = "") {
      const listDiv = document.getElementById("dictionaryList");
      listDiv.innerHTML = "";
      const entries = Object.entries(dictionary);
      const filtered = filter
        ? entries.filter(([word]) => word.toLowerCase().includes(filter.toLowerCase()))
        : entries;
      filtered.forEach(([word, data]) => {
        listDiv.innerHTML += `
          <div>
            <strong>${word}</strong> (${data.loaitu})<br>
            <b>Giải nghĩa:</b> ${data.nghia}<br>
            <b>Ví dụ:</b> ${data.vidu}<br>
            <b>Hoàn cảnh:</b> ${data.hoancanh}<br>
            <b>Phục nguyên:</b> ${data.phucnguyen}
          </div>
        `;
      });
    }

    function searchWord() {
      const query = document.getElementById("search").value;
      renderList(query);
    }

    function addWord() {
      const tu = document.getElementById("tu").value.trim();
      if (!tu) return alert("Hãy nhập từ!");
      dictionary[tu] = {
        loaitu: document.getElementById("loaitu").value.trim(),
        nghia: document.getElementById("nghia").value.trim(),
        vidu: document.getElementById("vidu").value.trim(),
        hoancanh: document.getElementById("hoancanh").value.trim(),
        phucnguyen: document.getElementById("phucnguyen").value.trim(),
      };
      localStorage.setItem(DICTIONARY_KEY, JSON.stringify(dictionary));
      renderList();
      alert("✅ Đã lưu từ!");
    }

    function handleLogin(response) {
      const data = parseJwt(response.credential);
      const userEmail = data.email;
      document.querySelector(".g_id_signin").style.display = "none";
      document.getElementById("logoutBtn").style.display = "inline-block";
      if (userEmail === ADMIN_EMAIL) {
        document.getElementById("adminPanel").style.display = "block";
        alert("Xin chào quản trị viên " + data.name + " 👑");
      } else {
        alert("Xin chào " + data.name + "! (Chế độ xem từ điển)");
      }
      renderList();
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      return JSON.parse(jsonPayload);
    }

    document.getElementById("logoutBtn").onclick = () => {
      location.reload();
    };

    renderList();
  </script>
</body>
</html>
